[package]
name = "offline-github"
version = "0.2.8"
edition = "2021"
description = "Your GitHub workspace, ready for airplane mode"
license = "MIT"
repository = "https://github.com/pkarw/offline-github"

[[bin]]
name = "ogh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
wait-timeout = "0.2"
libc = "0.2"
tempfile = "3"
base64 = "0.22"
serde_urlencoded = "0.7"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
pulldown-cmark = "0.13"
regex = "1"
