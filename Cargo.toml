[package]
name = "offline-github"
version = "0.1.0"
edition = "2021"
description = "Your GitHub workspace, ready for airplane mode"
license = "MIT"
repository = "https://github.com/pkarw/offline-github"

[[bin]]
name = "ogh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
